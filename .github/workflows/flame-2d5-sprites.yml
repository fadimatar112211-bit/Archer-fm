name: Validate Four Hero Sprite Runtime Bundles

concurrency:
  group: archer-fm-hero-runtime-contracts-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - ranger-reference-work
    paths:
      - 'lib/hero/**'
      - 'lib/game/render3/**'
      - 'lib/game/combat/**'
      - 'docs/heroes/HERO_ROSTER_SPEC.md'
      - 'test/**'
      - 'assets/heroes/**/renders/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/flame-2d5-sprites.yml'

permissions:
  contents: read

jobs:
  hero-runtime-contracts:
    name: Verify approved hero sprite runtime contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify four production manifests and runtime bundles
        run: |
          flutter test --reporter expanded \
            test/all_hero_render_manifest_test.dart \
            test/all_hero_runtime_bundle_test.dart \
            test/hero_catalog_test.dart \
            test/hero_render_policy_test.dart \
            test/hero_manifest_test.dart \
            test/ultimate_kit_contract_test.dart \
            test/hero_kit_progression_test.dart

      - name: Verify Shadow pilot and shared sprite renderer
        run: |
          flutter test --reporter expanded \
            test/shadow_walk_atlas_acceptance_test.dart \
            test/shadow_action_atlas_mapping_test.dart \
            test/shadow_walk_runtime_test.dart \
            test/sprite_actor_renderer_test.dart \
            test/sprite_actor_clip_resolver_test.dart

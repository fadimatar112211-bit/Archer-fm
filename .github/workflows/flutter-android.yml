name: Flutter Android validation

on:
  workflow_dispatch:
  push:
    branches: [main, feature/match-rules-foundation]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-android.yml'
  pull_request:
    branches: [heroes-complete]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-android.yml'

jobs:
  flutter-test-and-apk:
    # Pin the runner while Android Emulator boot on ubuntu-latest (26.04)
    # is failing before ADB can discover emulator-5554.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name archer_fm --org com.archerfm --no-pub .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - name: Free runner disk space for the Android emulator
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          docker system prune --all --force || true
          echo "Disk space after cleanup:"
          df -h /
      - uses: reactivecircus/android-emulator-runner@v2
        # GitHub-hosted Linux runners do not expose KVM to this job. The
        # emulator exits immediately with "-accel off" unless TCG is explicitly
        # opted into; keep the longer boot window for software CPU emulation.
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          disable-linux-hardware-acceleration: true
          script: |
            adb devices
            adb get-state
            adb install build/app/outputs/flutter-apk/app-debug.apk
            adb shell am force-stop com.archerfm.archer_fm || true
            adb shell am start -n com.archerfm.archer_fm/.MainActivity
            sleep 10
            adb shell pidof com.archerfm.archer_fm
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity'
            adb shell screencap -p /sdcard/archer-fm-launch.png
            adb pull /sdcard/archer-fm-launch.png build/archer-fm-launch.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archer-fm-android-validation
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/archer-fm-launch.png
          retention-days: 14

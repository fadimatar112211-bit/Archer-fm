name: Flutter Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - ranger-reference-work
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tools/**'
      - 'docs/monsters/**'
      - 'PROJECT_PROGRESS.md'
      - '.github/workflows/flutter-android.yml'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Configure release signing from secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          test -s android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=app/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run all tests
        run: timeout 20m flutter test --reporter expanded

      - name: Upload 3D hero visual captures
        uses: actions/upload-artifact@v4
        with:
          name: archer-fm-3d-hero-visual-captures
          path: build/arena-captures/
          if-no-files-found: error
          retention-days: 30

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: archer-fm-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Archer FM — Release ${{ github.run_number }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write build summary
        if: always()
        run: |
          {
            echo "### Archer FM Release APK"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- APK: build/app/outputs/flutter-apk/app-release.apk"
            echo "- Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v1.0.${{ github.run_number }}"
          } >> "$GITHUB_STEP_SUMMARY"

  android-emulator-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: timeout 35m flutter test --reporter expanded integration_test/app_smoke_test.dart

  generate-monster-glbs:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install free Blender runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy

      - name: Generate four rigged monster models
        run: |
          export PYTHONPATH="/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
          blender --background --factory-startup --python tools/monsters/generate_monsters_blender.py -- --output build/monster-glb
          python3 tools/validate_monster_glb.py --root build/monster-glb

      - name: Upload generated monster GLBs
        uses: actions/upload-artifact@v4
        with:
          name: archer-fm-rigged-monster-glbs
          path: build/monster-glb/
          if-no-files-found: error
          retention-days: 30

          timeout 12s adb logcat -d -v threadtime > build/android-emulator-diagnostics/logcat.txt 2>&1 || true
          free -h > build/android-emulator-diagnostics/host-memory.txt 2>&1 || true
          dmesg | tail -100 > build/android-emulator-diagnostics/kernel-tail.txt 2>&1 || true
          if [ -f /tmp/archer-emulator.log ]; then
            cp /tmp/archer-emulator.log build/android-emulator-diagnostics/emulator.log
          fi
          if [ -f /tmp/archer-emulator-watch.log ]; then
            cp /tmp/archer-emulator-watch.log build/android-emulator-diagnostics/emulator-watch.log
          fi
          if [ -f /sys/fs/cgroup/memory.events ]; then
            cp /sys/fs/cgroup/memory.events build/android-emulator-diagnostics/cgroup-memory-events.txt
          fi
          if [ -f /tmp/archer-emulator.pid ]; then
            PID="$(cat /tmp/archer-emulator.pid)"
            timeout 5s ps -fp "$PID" > build/android-emulator-diagnostics/emulator-process.txt 2>&1 || true
          fi

      - name: Upload Android emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archer-fm-android-emulator-diagnostics
          path: build/android-emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 14

  # Legacy disabled job retained for reference. The approved production direction
  # is reference-faithful rigged 3D monsters; the separate review workflow owns
  # prototype generation until those models pass visual acceptance.
  generate-monster-glbs:
    if: ${{ false }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install free Blender runtime
        run: |
          sudo timeout 10m apt-get update
          sudo timeout 18m apt-get install -y --no-install-recommends blender python3-numpy xvfb

      - name: Generate four rigged monster models
        run: |
          export PYTHONPATH="/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
          ARCHER_MONSTER_PREVIEWS=1 timeout 20m xvfb-run -a blender --background --factory-startup --python tools/monsters/generate_monsters_blender.py -- --output build/monster-glb
          python3 tools/validate_monster_glb.py --root build/monster-glb

      - name: Upload generated monster GLBs

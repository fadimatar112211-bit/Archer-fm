name: Flutter Android Release APK

concurrency:
  group: archer-fm-android-v2-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - ranger-reference-work
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tools/**'
      - 'docs/**'
      - 'PROJECT_PROGRESS.md'
      - '.github/workflows/flutter-android.yml'

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Analyze, test and build release APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Configure release signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          test -s android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=app/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: timeout 25m flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK and signature
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: archer-fm-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}-${{ github.run_id }}
          name: Archer FM — Release ${{ github.run_number }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android-emulator-smoke:
    name: Android emulator integration smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create and boot Android emulator
        shell: bash
        run: |
          set -euxo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK path missing}}"
          export PATH="$SDK/platform-tools:$PATH"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          AVDMANAGER="$(find "$SDK/cmdline-tools" -type f -name avdmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          "$SDKMANAGER" --licenses < <(yes) >/dev/null
          "$SDKMANAGER" --install "platform-tools" "emulator" "platforms;android-30" "system-images;android-30;google_apis;x86_64"
          echo "no" | "$AVDMANAGER" create avd --force -n archer_fm_api30 -k "system-images;android-30;google_apis;x86_64" -d pixel_2
          "$SDK/emulator/emulator" -avd archer_fm_api30 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -wipe-data -skin 540x960 -memory 6144 -cores 4 > /tmp/archer-emulator.log 2>&1 &
          echo "$!" > /tmp/archer-emulator.pid
          adb start-server
          DEVICE_READY=0
          for attempt in $(seq 1 120); do
            if adb devices | grep -qE '^emulator-[0-9]+[[:space:]]+device$'; then
              DEVICE_READY=1
              break
            fi
            sleep 5
          done
          test "$DEVICE_READY" = "1"
          BOOT_COMPLETED=0
          for attempt in $(seq 1 120); do
            if [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1" ]; then
              BOOT_COMPLETED=1
              break
            fi
            sleep 5
          done
          test "$BOOT_COMPLETED" = "1"
          adb shell input keyevent 82 || true
          adb devices -l

      - name: Run Android integration smoke test
        run: timeout 25m flutter test --reporter expanded integration_test/app_smoke_test.dart

      - name: Capture emulator diagnostics
        if: always()
        run: |
          mkdir -p build/android-emulator-diagnostics
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK" ]; then export PATH="$SDK/platform-tools:$PATH"; fi
          timeout 8s adb devices -l > build/android-emulator-diagnostics/adb-devices.txt 2>&1 || true
          timeout 12s adb logcat -d -v threadtime > build/android-emulator-diagnostics/logcat.txt 2>&1 || true
          free -h > build/android-emulator-diagnostics/host-memory.txt 2>&1 || true
          if [ -f /tmp/archer-emulator.log ]; then cp /tmp/archer-emulator.log build/android-emulator-diagnostics/emulator.log; fi
          if [ -f /tmp/archer-emulator.pid ]; then
            PID="$(cat /tmp/archer-emulator.pid)"
            ps -fp "$PID" > build/android-emulator-diagnostics/emulator-process.txt 2>&1 || true
          fi

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archer-fm-android-emulator-diagnostics
          path: build/android-emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 14

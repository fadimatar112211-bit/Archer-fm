name: Match rules checks

on:
  push:
    branches: [feature/match-rules-foundation]
    paths:
      - 'lib/game/match/**'
      - 'lib/game/network/**'
      - 'lib/game/world/**'
      - 'lib/game/progression/**'
      - 'lib/game/controls/**'
      - 'tool/**'
      - 'test/match_rules_test.dart'
      - 'test/game_client_test.dart'
      - 'test/websocket_game_host_test.dart'
      - 'test/authoritative_match_session_test.dart'
      - 'test/match_world_authority_test.dart'
      - 'test/game_client_reconnect_test.dart'
      - 'test/hero_progress_test.dart'
      - 'test/hero_progression_service_test.dart'
      - 'test/file_hero_progress_store_test.dart'
      - 'test/virtual_joystick_test.dart'
      - '.github/workflows/match-rules-checks.yml'
  pull_request:
    branches: [heroes-complete]
    paths:
      - 'lib/game/match/**'
      - 'lib/game/network/**'
      - 'lib/game/world/**'
      - 'lib/game/progression/**'
      - 'lib/game/controls/**'
      - 'tool/**'
      - 'test/match_rules_test.dart'
      - 'test/game_client_test.dart'
      - 'test/websocket_game_host_test.dart'
      - 'test/authoritative_match_session_test.dart'
      - 'test/match_world_authority_test.dart'
      - 'test/game_client_reconnect_test.dart'
      - 'test/hero_progress_test.dart'
      - 'test/hero_progression_service_test.dart'
      - 'test/file_hero_progress_store_test.dart'
      - 'test/virtual_joystick_test.dart'
      - '.github/workflows/match-rules-checks.yml'

jobs:
  match-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/game/match lib/game/network lib/game/world lib/game/progression lib/game/controls test/match_rules_test.dart test/game_client_test.dart test/websocket_game_host_test.dart test/authoritative_match_session_test.dart test/match_world_authority_test.dart test/game_client_reconnect_test.dart test/hero_progress_test.dart test/hero_progression_service_test.dart test/file_hero_progress_store_test.dart test/virtual_joystick_test.dart tool/dev_game_server.dart
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

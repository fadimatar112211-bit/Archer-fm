name: Match rules checks

on:
  push:
    branches: [feature/match-rules-foundation]
    paths:
      - 'lib/game/match/**'
      - 'test/match_rules_test.dart'
      - '.github/workflows/match-rules-checks.yml'
  pull_request:
    branches: [heroes-complete]
    paths:
      - 'lib/game/match/**'
      - 'test/match_rules_test.dart'
      - '.github/workflows/match-rules-checks.yml'

jobs:
  match-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/game/match/match_rules.dart test/match_rules_test.dart
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test/match_rules_test.dart

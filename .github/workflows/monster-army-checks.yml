name: Monster Army Checks

on:
  push:
    branches: [monster-army-work]
    paths:
      - 'lib/monsters/**'
      - 'test/monster_army_test.dart'
      - 'test/monster_projectiles_test.dart'
      - 'test/monster_projectile_manager_test.dart'
      - 'test/monster_projectiles_test.dart'
      - 'test/monster_projectile_manager_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/monster-army-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/monsters/**'
      - 'test/monster_army_test.dart'
      - 'test/monster_projectiles_test.dart'
      - 'test/monster_projectile_manager_test.dart'
      - 'test/monster_projectiles_test.dart'
      - 'test/monster_projectile_manager_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/monster-army-checks.yml'
  workflow_dispatch:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/monsters test/monster_army_test.dart test/monster_projectiles_test.dart
      - run: flutter analyze
      - run: flutter test test/monster_army_test.dart test/monster_projectiles_test.dart

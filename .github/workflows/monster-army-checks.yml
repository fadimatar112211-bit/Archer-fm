name: Monster Army Checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [monster-army-work, feature/match-rules-foundation, feature/phase-5-account-cloud-persistence]
    paths:
      - 'lib/monsters/**'
      - 'test/monster_*_test.dart'
      - 'assets/monsters/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/monster-army-checks.yml'
  pull_request:
    branches: [main, heroes-complete]
    paths:
      - 'lib/monsters/**'
      - 'test/monster_*_test.dart'
      - 'assets/monsters/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/monster-army-checks.yml'
  workflow_dispatch:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze lib/monsters test/monster_army_test.dart test/monster_projectiles_test.dart test/monster_match_health_integration_test.dart test/monster_formation_movement_test.dart test/monster_animation_test.dart test/monster_sprite_view_test.dart test/monster_animation_catalog_test.dart test/monster_navigation_and_formation_test.dart test/monster_spatial_index_test.dart test/monster_progression_test.dart test/monster_match_world_test.dart test/monster_battle_layer_test.dart test/monster_match_runtime_test.dart test/monster_glb_assets_test.dart test/monster3d_test.dart
      - run: flutter test test/monster_army_test.dart test/monster_projectiles_test.dart test/monster_match_health_integration_test.dart test/monster_formation_movement_test.dart test/monster_animation_test.dart test/monster_sprite_view_test.dart test/monster_animation_catalog_test.dart test/monster_navigation_and_formation_test.dart test/monster_spatial_index_test.dart test/monster_progression_test.dart test/monster_match_world_test.dart test/monster_battle_layer_test.dart test/monster_match_runtime_test.dart test/monster_glb_assets_test.dart test/monster3d_test.dart

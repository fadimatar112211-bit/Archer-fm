name: OpenCode Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  opencode:
    if: |
      github.event.comment.user.login == github.repository_owner &&
      (startsWith(github.event.comment.body, '/oc') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCode CLI
        run: npm install --global @opencode/cli

      - name: Create task branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          BRANCH="opencode/task-${RUN_ID}"
          git checkout -b "$BRANCH"
          echo "OPENCODE_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Run OpenCode
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK_COMMENT: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PROMPT="${TASK_COMMENT#\/oc}"
          PROMPT="${PROMPT#\/opencode}"
          PROMPT="$(printf '%s' "$PROMPT" | sed 's/^[[:space:]]*//')"
          if [ -z "$PROMPT" ]; then
            echo "No task text was supplied after /oc or /opencode."
            exit 1
          fi
          opencode run --standalone --model google/gemini-3.5-flash --auto \
            "Work in this repository. Follow AGENTS.md and existing project instructions. Implement the user's task carefully, run relevant tests, and do not merge or deploy. User task: $PROMPT"

      - name: Commit and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "OpenCode made no file changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "OpenCode: implement issue #${ISSUE_NUMBER}"
          git push --set-upstream origin "$OPENCODE_BRANCH"
          gh pr create \
            --repo "$REPOSITORY" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$OPENCODE_BRANCH" \
            --title "OpenCode changes for issue #${ISSUE_NUMBER}" \
            --body "Automated changes proposed by OpenCode for issue #${ISSUE_NUMBER}. Review the diff and CI results before merging."

name: Ranger Blender Asset Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/blender/**"
      - "tools/validate_hero_assets.py"
      - "tools/tests/**"
      - "assets/heroes/ranger/source/render_config.json"
      - ".github/workflows/ranger-assets.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ranger-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 python3-pil
          blender --version

      - name: Python syntax check
        run: |
          python3 -m py_compile \
            tools/blender/build_ranger_source.py \
            tools/blender/render_hero.py \
            tools/blender/pack_hero_atlases.py \
            tools/blender/validate_ranger_source.py \
            tools/blender/validate_rendered_frames.py \
            tools/validate_hero_assets.py

      - name: Run Python asset pipeline tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Build editable Ranger source
        run: blender -b --python tools/blender/build_ranger_source.py

      - name: Validate Blender scene and rig
        run: |
          blender -b assets/heroes/ranger/source/ranger_source.blend \
            --python tools/blender/validate_ranger_source.py

      - name: Render all states and directions
        run: |
          blender -b assets/heroes/ranger/source/ranger_source.blend \
            --python tools/blender/render_hero.py -- \
            --config assets/heroes/ranger/source/render_config.json

      - name: Reject flattened or invalid rendered frames
        run: |
          python3 tools/blender/validate_rendered_frames.py \
            --root assets/heroes/ranger/renders --resolution 192

      - name: Pack sprite atlases
        run: |
          blender -b assets/heroes/ranger/source/ranger_source.blend \
            --python tools/blender/pack_hero_atlases.py -- \
            --manifest assets/heroes/ranger/renders/ranger_manifest.json

      - name: Validate final sprite manifest
        run: |
          python3 tools/validate_hero_assets.py \
            assets/heroes/ranger/renders/ranger_manifest.json

      # Upload before the Git push so the generated frames remain inspectable
      # even if main protection or a concurrent update rejects the commit.
      - name: Upload generated source and sprites
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranger-blender-source-and-sprites
          path: |
            assets/heroes/ranger/source/ranger_source.blend
            assets/heroes/ranger/renders/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit validated Ranger source, frames and atlases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(cat tools/blender/active_hero.txt)" != "ranger" ]; then
            echo "Active hero is not Ranger; runtime asset commit is skipped."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/heroes/ranger/source/ranger_source.blend \
            assets/heroes/ranger/renders/ranger_manifest.json \
            assets/heroes/ranger/renders/atlases/ \
            assets/heroes/ranger/renders/idle/ \
            assets/heroes/ranger/renders/walk/ \
            assets/heroes/ranger/renders/run/ \
            assets/heroes/ranger/renders/attack/ \
            assets/heroes/ranger/renders/skill/ \
            assets/heroes/ranger/renders/dodge/ \
            assets/heroes/ranger/renders/hit/ \
            assets/heroes/ranger/renders/death/
          echo "Staged complete Ranger source and render set:"
          git status --short
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Validated Ranger source, frames and atlases are already current."
            exit 0
          fi
          git commit -m "Update validated Ranger source and sprite atlases"
          git fetch origin main
          publish_pr() {
            local branch="automation/ranger-assets-${GITHUB_RUN_ID}"
            git push origin "HEAD:refs/heads/${branch}"
            gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${branch}" \
              --title "Update validated Ranger source and sprite assets" \
              --body "Generated by Ranger Blender Asset Pipeline. Includes the rebuilt Blender source, all rendered frames, 64 atlases and the validated manifest. The artifact was uploaded before this publish step."
          }
          if ! git rebase origin/main; then
            echo "Main advanced with overlapping changes; publishing a review branch."
            git rebase --abort || true
            publish_pr
            exit 0
          fi
          if git push origin HEAD:main; then
            echo "Validated Ranger source, frames and atlases were committed directly to main."
          else
            echo "Direct push to main was rejected; publishing a review PR instead."
            publish_pr
          fi

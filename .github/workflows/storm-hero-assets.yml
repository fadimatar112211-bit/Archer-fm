name: Storm hero assets

on:
  workflow_dispatch:
  push:
    branches: [heroes-complete, flame-finalize]
    paths:
      - "tools/blender/render_storm_glb.py"
      - "tools/blender/hero_profiles.py"
      - "tools/blender/build_ranger_source.py"
      - "assets/heroes/flame/REFERENCE_MATCH.md"
      - "tools/blender/export_hero_glb.py"
      - "tools/blender/validate_hero_glb.py"
      - "tools/blender/pack_storm_atlases.py"
      - "tools/blender/validate_hero_assets.py"
      - "tools/pack_hero_atlases.py"
      - ".github/workflows/storm-hero-assets.yml"
      - "docs/heroes/2_5d_visual_contract.md"
      - "assets/heroes/ranger/renders/**"
      - "assets/heroes/flame/renders/**"
      - "assets/heroes/shadow/renders/**"
      - "assets/heroes/*/source/**"

permissions:
  contents: write


jobs:
  render-storm:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out Archer FM
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Blender 3.6.13 and image tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xz-utils python3-pil
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender3.6/blender-3.6.13-linux-x64.tar.xz \
            --output /tmp/blender-3.6.13-linux-x64.tar.xz
          sudo tar -xJf /tmp/blender-3.6.13-linux-x64.tar.xz -C /opt
          echo "/opt/blender-3.6.13-linux-x64" >> "$GITHUB_PATH"
          /opt/blender-3.6.13-linux-x64/blender --background --python-expr \
            "import bpy; print('ARCHER_FM_BLENDER_VERSION=' + bpy.app.version_string)"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Export Ranger, Flame and Shadow as animated GLB models
        run: |
          set -euo pipefail
          for hero in ranger flame shadow; do
            blender --background "assets/heroes/${hero}/source/${hero}_source.blend" \
              --python-exit-code 1 --python tools/blender/export_hero_glb.py -- \
              --hero "${hero}" --config assets/heroes/ranger/source/render_config.json
          done

      - name: Render Flame again from its source using the reference-tuned model
        run: |
          set -euo pipefail
          echo flame > tools/blender/active_hero.txt
          blender --background assets/heroes/flame/source/flame_source.blend \
            --python-exit-code 1 --python tools/blender/render_hero.py -- \
            --config assets/heroes/ranger/source/render_config.json
          test -s assets/heroes/flame/renders/flame_manifest.json

      - name: Repack and validate Flame 2.5D atlases
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/pack_hero_atlases.py \
            --manifest assets/heroes/flame/renders/flame_manifest.json
          /usr/bin/python3 tools/blender/validate_hero_assets.py flame
          test "$(find assets/heroes/flame/renders/atlases -maxdepth 1 -name '*.png' | wc -l)" -eq 64
          test "$(find assets/heroes/flame/renders/atlases -maxdepth 1 -name '*.json' | wc -l)" -eq 64
          test -s assets/heroes/flame/model/flame_animated.glb
          echo "FLAME_2_5D_ASSETS_VALIDATED"
          touch "$RUNNER_TEMP/flame-validation-ok"

      - name: Fetch the rigged Storm GLB from the implementation branch
        run: |
          git fetch origin implementation/visual-systems-next-pass --depth=1
          mkdir -p assets/heroes/storm/model
          git show FETCH_HEAD:assets/heroes/storm/model/storm_animated.glb > assets/heroes/storm/model/storm_animated.glb
          test -s assets/heroes/storm/model/storm_animated.glb
          ls -lh assets/heroes/storm/model/storm_animated.glb

      - name: Validate all four animated GLB models
        run: |
          set -euo pipefail
          for hero in ranger flame shadow storm; do
            blender --background --python-exit-code 1 \
              --python tools/blender/validate_hero_glb.py -- \
              --hero "${hero}" --model "assets/heroes/${hero}/model/${hero}_animated.glb"
          done

      - name: Render eight real animation states in eight directions
        run: |
          blender --background --python-exit-code 1 --python tools/blender/render_storm_glb.py
          test -s assets/heroes/storm/renders/storm_manifest.json

      - name: Pack and validate all Storm atlases
        run: |
          /usr/bin/python3 tools/blender/pack_storm_atlases.py
          test "$(find assets/heroes/storm/renders/atlases -maxdepth 1 -name '*.png' | wc -l)" -eq 64
          test "$(find assets/heroes/storm/renders/atlases -maxdepth 1 -name '*.json' | wc -l)" -eq 64
          echo "STORM_ATLAS_COUNT_OK=64"
          /usr/bin/python3 tools/blender/validate_hero_assets.py

      - name: Register all hero models and Storm animation atlases in Flutter assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("pubspec.yaml")
          text = path.read_text(encoding="utf-8")
          anchor = "    - assets/heroes/shadow/renders/atlases/\n"
          additions = [
              "    - assets/heroes/storm/renders/storm_manifest.json\n",
              "    - assets/heroes/storm/renders/atlases/\n",
          ]
          additions.extend(
              f"    - assets/heroes/{hero}/model/{hero}_animated.glb\n"
              for hero in ("ranger", "flame", "shadow", "storm")
          )
          for entry in additions:
              if entry.strip() not in text:
                  if anchor not in text:
                      raise SystemExit("Could not locate Flutter asset insertion point")
                  text = text.replace(anchor, anchor + entry, 1)
                  anchor = entry
          path.write_text(text, encoding="utf-8")
          print("REGISTERED_ALL_FOUR_HERO_MODELS_AND_STORM_ATLASES")
          PY

      - name: Run Flutter analysis and tests against the complete four-hero bundle
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload generated Flame and Storm assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storm-directional-assets
          path: |
            assets/heroes/flame/model/flame_animated.glb
            assets/heroes/flame/renders/flame_manifest.json
            assets/heroes/flame/renders/atlases/
            assets/heroes/storm/renders/storm_manifest.json
            assets/heroes/storm/renders/atlases/
            assets/heroes/*/model/*.glb
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Commit successfully generated hero assets
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f "$RUNNER_TEMP/flame-validation-ok" ]]; then
            git add assets/heroes/flame/model/flame_animated.glb
            git add assets/heroes/flame/renders/flame_manifest.json assets/heroes/flame/renders/atlases
          fi
          if [[ -s assets/heroes/ranger/model/ranger_animated.glb ]]; then git add assets/heroes/ranger/model/ranger_animated.glb; fi
          if [[ -s assets/heroes/shadow/model/shadow_animated.glb ]]; then git add assets/heroes/shadow/model/shadow_animated.glb; fi
          if [[ -s assets/heroes/storm/model/storm_animated.glb ]]; then git add assets/heroes/storm/model/storm_animated.glb; fi
          if [[ -s assets/heroes/storm/renders/storm_manifest.json ]]; then
            git add assets/heroes/storm/renders
          fi
          if [[ -f pubspec.yaml ]]; then git add pubspec.yaml; fi
          if git diff --cached --quiet; then
            echo "No validated generated hero assets to commit."
          else
            git commit -m "Store validated generated hero assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

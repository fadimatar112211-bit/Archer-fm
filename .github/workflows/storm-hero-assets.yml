name: Storm hero assets

on:
  push:
    branches: [heroes-complete]
    paths:
      - "tools/blender/render_storm_glb.py"
      - "tools/blender/pack_storm_atlases.py"
      - "tools/blender/validate_hero_assets.py"
      - ".github/workflows/storm-hero-assets.yml"
      - "assets/heroes/ranger/renders/**"
      - "assets/heroes/flame/renders/**"
      - "assets/heroes/shadow/renders/**"
      - "assets/heroes/storm/renders/**"
  pull_request:
    branches: [main]
    paths:
      - "tools/blender/render_storm_glb.py"
      - "tools/blender/pack_storm_atlases.py"
      - "tools/blender/validate_hero_assets.py"
      - ".github/workflows/storm-hero-assets.yml"
      - "assets/heroes/ranger/renders/**"
      - "assets/heroes/flame/renders/**"
      - "assets/heroes/shadow/renders/**"
      - "assets/heroes/storm/renders/**"

permissions:
  contents: write

concurrency:
  group: storm-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-storm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Archer FM
        uses: actions/checkout@v4
        with:
          ref: heroes-complete
          fetch-depth: 0

      - name: Install Blender and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-pil

      - name: Fetch the rigged Storm GLB from the implementation branch
        run: |
          git fetch origin implementation/visual-systems-next-pass --depth=1
          mkdir -p assets/heroes/storm/model
          git show FETCH_HEAD:assets/heroes/storm/model/storm_animated.glb > assets/heroes/storm/model/storm_animated.glb
          test -s assets/heroes/storm/model/storm_animated.glb
          ls -lh assets/heroes/storm/model/storm_animated.glb

      - name: Render eight real animation states in eight directions
        run: |
          blender --background --python-exit-code 1 --python tools/blender/render_storm_glb.py
          test -s assets/heroes/storm/renders/storm_manifest.json

      - name: Pack and validate all Storm atlases
        run: |
          /usr/bin/python3 tools/blender/pack_storm_atlases.py
          test "$(find assets/heroes/storm/renders/atlases -maxdepth 1 -name '*.png' | wc -l)" -eq 64
          test "$(find assets/heroes/storm/renders/atlases -maxdepth 1 -name '*.json' | wc -l)" -eq 64
          echo "STORM_ATLAS_COUNT_OK=64"
          /usr/bin/python3 tools/blender/validate_hero_assets.py

      - name: Upload generated Storm assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storm-directional-assets
          path: |
            assets/heroes/storm/renders/storm_manifest.json
            assets/heroes/storm/renders/atlases/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated assets to heroes-complete
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heroes/storm/model/storm_animated.glb assets/heroes/storm/renders
          if git diff --cached --quiet; then
            echo "No generated Storm asset changes to commit."
          else
            git commit -m "Generate Storm directional animation atlases"
            git push origin HEAD:heroes-complete
          fi

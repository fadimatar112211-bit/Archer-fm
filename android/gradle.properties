# Phone-sized container: keep Gradle inside ~2 GB of heap.
org.gradle.jvmargs=-Xmx1792m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
org.gradle.workers.max=2
# This container's outbound links reset often; keep Gradle patient.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=12
systemProp.org.gradle.internal.repository.initial.backoff=800
# arm64 container: run AGP's x86_64 aapt2 through qemu.
android.aapt2FromMavenOverride=/opt/android-sdk/tools/aapt2
android.useAndroidX=true
android.enableJetifier=true

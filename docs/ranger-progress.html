<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="300"><title>تقدم الرامي الأخضر | Archer FM</title>
<style>
:root{color-scheme:dark;--bg:#101713;--panel:#18231c;--line:#2b3a30;--text:#edf5ee;--muted:#a9b9ac;--green:#45c477;--gold:#e3bd62}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b3324,#101713 65%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}.wrap{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.tag{border:1px solid var(--line);border-radius:99px;padding:6px 12px;color:var(--muted);font-size:13px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:16px}.eyebrow{color:var(--muted);font-size:14px}.number{font-size:clamp(52px,13vw,86px);font-weight:800;line-height:1.15;letter-spacing:-3px;color:var(--green)}.track{height:14px;background:#29372d;border-radius:20px;overflow:hidden;margin:14px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#23894d,#63df91);border-radius:20px;transition:width .5s}.row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.dot{font-size:20px;line-height:1}.done{color:var(--green)}.doing{color:var(--gold)}.todo{color:#718078}.desc{color:var(--muted);font-size:13px;margin-top:3px}.foot{color:var(--muted);font-size:12px;margin:16px 4px}.error{color:#f0ad76}
</style></head><body><main class="wrap">
<div class="top"><div><div class="eyebrow">ARCHER FM · HERO PRODUCTION</div><h1 style="margin:5px 0">الرامي الأخضر</h1></div><span class="tag" id="state">جاري تحميل الحالة…</span></div>
<section class="panel"><div class="eyebrow">نسبة الإنجاز الموثقة</div><div class="number" id="percent">—%</div><div class="track"><div class="fill" id="bar"></div></div><div id="summary" class="eyebrow">يتم جلب آخر تحديث محفوظ في GitHub.</div></section>
<section class="panel"><h2 style="margin:0 0 8px;font-size:19px">مراحل إكمال الشخصية</h2><div id="tasks"></div></section>
<div class="foot">تُحدّث هذه الصفحة عند حفظ تقدم جديد في المستودع. التحديث التلقائي كل 5 دقائق. آخر تحديث: <span id="updated">—</span><br>النسبة لا تُرفع إلا بعد تنفيذ وفحص المرحلة فعلياً.</div>
</main><script>
(async()=>{const $=id=>document.getElementById(id);try{const url=new URL('./ranger-progress.json',location.href);url.searchParams.set('v',Date.now());const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const p=Math.max(0,Math.min(100,Number(d.percent)||0));$('percent').textContent=p+'%';$('bar').style.width=p+'%';$('summary').textContent=d.summary||'';$('state').textContent=d.status||'قيد الإنجاز';$('updated').textContent=d.updated_at||'غير محدد';$('tasks').innerHTML=(d.milestones||[]).map(x=>'<div class="row"><span class="dot '+(x.status==='done'?'done':x.status==='doing'?'doing':'todo')+'">'+(x.status==='done'?'✓':x.status==='doing'?'◉':'○')+'</span><div><b></b><div class="desc"></div></div></div>').join('');[...$('tasks').querySelectorAll('.row')].forEach((el,i)=>{el.querySelector('b').textContent=d.milestones[i].title;el.querySelector('.desc').textContent=d.milestones[i].detail||''});}catch(e){$('state').textContent='تعذر تحميل التحديث';$('summary').textContent='تأكد من فتح الصفحة عبر GitHub Pages.';$('summary').className='eyebrow error';}})();
</script></body></html>

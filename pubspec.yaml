name: archer_fm
description: Archer FM mobile game prototype.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/heroes3d/
    - assets/audio/flame/
    - assets/monsters/
    - assets/monsters/bog-monster/
    - assets/monsters/werewolf/
    - assets/monsters/stone-golem/
    - assets/monsters/blind-stalker/
    - assets/monsters/legacy/

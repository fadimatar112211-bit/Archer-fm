name: archer_fm
description: Archer FM mobile game prototype.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Runtime needs only manifests and packed atlases. Raw per-frame PNGs,
    # source renders and reference images stay in the repository, not the APK.
    - assets/heroes/ranger/renders/ranger_manifest.json
    - assets/heroes/ranger/renders/atlases/
    - assets/heroes/flame/renders/flame_manifest.json
    - assets/heroes/flame/renders/atlases/
    - assets/heroes/shadow/renders/shadow_manifest.json
    - assets/heroes/shadow/renders/atlases/\n    - assets/monsters/legacy/

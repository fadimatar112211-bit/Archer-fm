name: archer_fm
description: Archer FM mobile game prototype.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Runtime needs only manifests and packed atlases. Raw per-frame PNGs,
    # source renders and reference images stay in the repository, not the APK.
    - assets/heroes/flame/renders/flame_manifest.json
    - assets/heroes/flame/renders/atlases/
    - assets/heroes/shadow/renders/shadow_manifest.json
    - assets/heroes/shadow/renders/atlases/
    - assets/heroes/ranger_new/renders/ranger_new_manifest.json
    - assets/heroes/ranger_new/renders/atlases/
    - assets/heroes/storm/renders/storm_manifest.json
    - assets/heroes/storm/renders/atlases/
    # Real in-game 3D hero models (glTF binary: mesh + bones + animations).
    - assets/heroes/ranger_new/ranger_animated.glb
    - assets/heroes/flame/model/flame_animated.glb
    - assets/heroes/shadow/model/shadow_animated.glb
    - assets/heroes/storm/model/storm_animated.glb
    # Step 13: deterministic WAV music loops and combat/ability/environment cues
    # generated by tools/audio/generate_audio.py.
    - assets/audio/
